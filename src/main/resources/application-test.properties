# Test execution profile.
# Activated via SPRING_PROFILES_ACTIVE=test.
# Excludes real DataSource, Flyway and JPA/Hibernate auto-configuration so the
# ordinary Spring context smoke test does not require a live local MySQL instance.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
