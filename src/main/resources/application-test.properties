# Test execution profile.
# Activated via SPRING_PROFILES_ACTIVE=test.
# Excludes real DataSource and Flyway auto-configuration so the ordinary Spring
# context smoke test does not require a live local MySQL instance.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
