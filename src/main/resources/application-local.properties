# Local development profile.
# Activated via SPRING_PROFILES_ACTIVE=local.
# JPA/Flyway configuration for this profile is introduced in PART 57-58.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/future_minds}
spring.datasource.username=${DB_USERNAME:future_minds}
spring.datasource.password=${DB_PASSWORD:}

# SQL logging is a local development convenience only - never enabled globally or in prod.
spring.jpa.show-sql=true

# Local Logging
logging.level.au.com.futureminds=DEBUG

#Auth server
# Issuer must match what the Android emulator's Keycloak client sees itself as
# (10.0.2.2 is the emulator's alias for the host machine), since Spring validates
# the JWT "iss" claim against this value. The backend process runs on the host
# itself, though, so it fetches signing keys via "localhost" instead.
AUTH_ISSUER_URI=http://10.0.2.2:8180/realms/future-minds
AUTH_JWK_SET_URI=http://localhost:8180/realms/future-minds/protocol/openid-connect/certs