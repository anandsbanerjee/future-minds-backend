#Application Properties
# Active profile is selected externally (SPRING_PROFILES_ACTIVE=local|test|prod), never hard-coded here.
spring.application.name=future-minds-backend
server.port=${SERVER_PORT:8080}

# JPA - Flyway remains the sole schema owner; Hibernate only validates mappings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API error handling
spring.mvc.problemdetails.enabled=true

# Actuator - expose health only
management.endpoints.web.exposure.include=health

# Logging
# application.properties
logging.level.root=INFO
logging.level.au.com.futureminds=INFO
