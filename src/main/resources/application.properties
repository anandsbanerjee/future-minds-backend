#Application Properties
# Active profile is selected externally (SPRING_PROFILES_ACTIVE=local|test|prod), never hard-coded here.
spring.application.name=future-minds-backend
server.port=${SERVER_PORT:8080}

# JPA - Flyway remains the sole schema owner; Hibernate only validates mappings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API error handling
spring.mvc.problemdetails.enabled=true

# Actuator - expose health only
management.endpoints.web.exposure.include=health

# Logging
# application.properties
logging.level.root=INFO
logging.level.au.com.futureminds=INFO

# auth server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI}
# Optional override for fetching signing keys from a different address than the
# issuer (e.g. local dev where the mobile emulator and the backend reach Keycloak
# via different hostnames). Blank by default so issuer-uri discovery is used
# everywhere except where AUTH_JWK_SET_URI is explicitly set.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:}
