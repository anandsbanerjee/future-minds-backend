#Application Properties
# Active profile is selected externally (SPRING_PROFILES_ACTIVE=local|test|prod), never hard-coded here.
spring.application.name=future-minds-backend
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/future_minds
spring.datasource.username=future_minds
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# prevents persistence sessions from being kept open into the presentation/web layer later.
spring.jpa.open-in-view=false

# API error handling
spring.mvc.problemdetails.enabled=true

# Actuator - expose health only
management.endpoints.web.exposure.include=health
